<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check Vehicle Loan</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f4f7f6; text-align: center; }
    .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
    input { width: 70%; padding: 10px; margin-right: 5px; font-size: 16px; }
    button { padding: 10px 15px; font-size: 16px; background: #28a745; color: white; border: none; cursor: pointer; }
    #resultBox { margin-top: 20px; text-align: left; background: #eee; padding: 10px; border-radius: 5px; display: none; }
  </style>
</head>
<body>

  <div class="container">
    <h2>Vehicle Challan / Loan Status</h2>
    <input type="text" id="vehicleInput" placeholder="Enter Vehicle No (e.g. UP16CD1993)">
    <button onclick="checkLoan()">Check</button>

    <div id="resultBox">
      <pre id="jsonDisplay"></pre>
    </div>
  </div>

  <script>
    async function checkLoan() {
      const vehicleNum = document.getElementById('vehicleInput').value.trim();
      const resultBox = document.getElementById('resultBox');
      const jsonDisplay = document.getElementById('jsonDisplay');

      if (!vehicleNum) {
        alert("Please enter a vehicle number");
        return;
      }

      resultBox.style.display = "none";

      try {
        const targetUrl = "https://rto-vehicle-information-india.p.rapidapi.com/getVehicleChallan";
        const response = await fetch("https://corsproxy.io/?" + encodeURIComponent(targetUrl), {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-rapidapi-host": "rto-vehicle-information-india.p.rapidapi.com",
            "x-rapidapi-key": "अपनी_RAPIDAPI_KEY_यहाँ_पेस्ट_करें"
          },
          body: JSON.stringify({
            vehicle_no: vehicleNum,
            consent: "Y",
            consent_text: "I hereby give my consent"
          })
        });

        const data = await response.json();
        resultBox.style.display = "block";
        jsonDisplay.innerText = JSON.stringify(data, null, 2);

      } catch (error) {
        alert("Error fetching data: " + error.message);
      }
    }
  </script>

</body>
</html>
